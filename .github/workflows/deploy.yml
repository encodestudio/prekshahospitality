name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: false

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1

  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ICS_WHATSAPP_TICKET_TEMPLATE: ${{ secrets.ICS_WHATSAPP_TICKET_TEMPLATE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_URL,ICS_WHATSAPP_TICKET_TEMPLATE
          script_stop: true
          script: |
            cd ~/prekshahospitality
            git fetch origin main
            git reset --hard origin/main

            cd backend

            # Sync select settings from GitHub secrets into the server .env (create or update in place).
            grep -q "^BACKEND_URL=" .env 2>/dev/null && sed -i "s#^BACKEND_URL=.*#BACKEND_URL=$BACKEND_URL#" .env || echo "BACKEND_URL=$BACKEND_URL" >> .env
            grep -q "^ICS_WHATSAPP_TICKET_TEMPLATE=" .env 2>/dev/null && sed -i "s#^ICS_WHATSAPP_TICKET_TEMPLATE=.*#ICS_WHATSAPP_TICKET_TEMPLATE=$ICS_WHATSAPP_TICKET_TEMPLATE#" .env || echo "ICS_WHATSAPP_TICKET_TEMPLATE=$ICS_WHATSAPP_TICKET_TEMPLATE" >> .env

            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            deactivate
            sudo systemctl restart gunicorn

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Sync frontend build to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: frontend-build/
          remote_path: /var/www/preksha/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}
